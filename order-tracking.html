<!doctype html>

<head>
<meta charset="utf-8" />

<meta name="description" content="Track your Sera Labs order by reference number." />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<body class="page-body" data-page="tracking">

<header id="site-nav"></header>

<main class="page">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="index.html">Home</a>
    <span aria-hidden="true">/</span>
    <span aria-current="page">Order Tracking</span>
  </nav>

  <h1 class="page-title">Track your order.</h1>
  <p class="page-intro">
    Enter your order reference and email to retrieve current status, shipping, and batch.
  </p>

  <section class="page-section">
    <form class="form-stack" onsubmit="event.preventDefault(); alert('Order tracking coming soon.');">
      <label>
        Order reference
        <input type="text" name="order" placeholder="SR-XXXXXX" required />
      </label>
      <label>
        Email
        <input type="email" name="email" placeholder="you@research.org" required />
      </label>
      <button type="submit">Track order</button>
    </form>
  </section>
</main>

<footer id="site-footer"></footer>
