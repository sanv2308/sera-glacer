<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your cart · Sera Labs</title>
<meta name="description" content="Review your Sera Labs research peptide cart." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@200;300;400;500;600&family=Manrope:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared/site.css?v=20260519nav4" />
<style>
  .cart-page__layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 48px;
  }
  .cart-page__items {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .cart-page__items .cart-item {
    padding: 18px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .cart-page__items .cart-item:last-child {
    border-bottom: 0;
  }
  .cart-page__summary {
    background: #fff;
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    padding: 28px;
    height: fit-content;
    position: sticky;
    top: calc(var(--nav-height) + 24px);
  }
  .cart-page__summary h3 {
    margin: 0 0 16px;
    font-family: var(--display);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .cart-page__row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-family: var(--display);
    font-size: 14px;
    color: var(--ink-soft);
  }
  .cart-page__row--total {
    border-top: 1px solid var(--line-soft);
    margin-top: 8px;
    padding-top: 16px;
    color: var(--ink);
    font-weight: 500;
  }
  .cart-page__row span:last-child {
    font-family: var(--mono);
    color: var(--ink);
  }
  .cart-page__empty {
    padding: 80px 0;
    text-align: center;
    color: var(--ink-mute);
    font-family: var(--display);
    font-size: 17px;
  }
  .cart-page__empty a {
    color: var(--accent-deep);
    text-decoration: none;
    border-bottom: 1px solid currentColor;
  }
  @media (max-width: 820px) {
    .cart-page__layout {
      grid-template-columns: 1fr;
      gap: 32px;
    }
    .cart-page__summary {
      position: static;
    }
  }
</style>
</head>
<body class="page-body" data-page="cart">

<header id="site-nav"></header>

<main class="page">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="index.html">Home</a>
    <span aria-hidden="true">/</span>
    <span aria-current="page">Cart</span>
  </nav>

  <h1 class="page-title">Your cart.</h1>

  <section class="cart-page__layout">
    <div class="cart-page__items" data-cart-page-items>
      <p class="cart-page__empty">Loading...</p>
    </div>

    <aside class="cart-page__summary">
      <h3>Order summary</h3>
      <div class="cart-page__row">
        <span>Items</span>
        <span data-cart-page-count>0</span>
      </div>
      <div class="cart-page__row">
        <span>Subtotal</span>
        <span data-cart-page-subtotal>$0.00</span>
      </div>
      <div class="cart-page__row">
        <span>Shipping</span>
        <span>Calculated at checkout</span>
      </div>
      <div class="cart-page__row cart-page__row--total">
        <span>Total</span>
        <span data-cart-page-total>$0.00</span>
      </div>
      <button class="cart-drawer__checkout" type="button" style="margin-top: 18px;" onclick="alert('Checkout coming soon.')">Checkout</button>
    </aside>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="shared/site.js?v=20260519nav4" defer></script>
<script defer>
  document.addEventListener('DOMContentLoaded', function () {
    function render() {
      const items = JSON.parse(localStorage.getItem('sera_cart_v1') || '[]');
      const itemsEl = document.querySelector('[data-cart-page-items]');
      const countEl = document.querySelector('[data-cart-page-count]');
      const subEl = document.querySelector('[data-cart-page-subtotal]');
      const totalEl = document.querySelector('[data-cart-page-total]');
      if (!itemsEl) return;

      if (items.length === 0) {
        itemsEl.innerHTML = '<p class="cart-page__empty">Your cart is empty. <a href="shop.html">Browse the shop →</a></p>';
        countEl.textContent = '0';
        subEl.textContent = '$0.00';
        totalEl.textContent = '$0.00';
        return;
      }

      let subtotal = 0;
      let count = 0;
      const trashIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M6 7l1 13a2 2 0 0 0 2 1.8h6a2 2 0 0 0 2-1.8l1-13"/></svg>';
      itemsEl.innerHTML = items.map(item => {
        const priceNum = parseFloat(item.price);
        const hasPrice = !isNaN(priceNum);
        const lineTotal = hasPrice ? priceNum * item.qty : 0;
        if (hasPrice) subtotal += lineTotal;
        count += item.qty;
        const imgHtml = item.image ? `<img src="assets/catalog-before-hover/${item.image}" alt="" />` : '';
        const priceLabel = hasPrice ? `$${priceNum.toFixed(2)}` : `$${item.price}`;
        return `
          <div class="cart-item">
            <div class="cart-item__thumb">${imgHtml}</div>
            <div class="cart-item__body">
              <span class="cart-item__name">${item.name}</span>
              <span class="cart-item__price">${priceLabel}</span>
            </div>
            <div class="cart-item__controls">
              <div class="cart-item__qty">
                <button type="button" data-qty-dec="${item.id}" aria-label="Decrease quantity">−</button>
                <span>${item.qty}</span>
                <button type="button" data-qty-inc="${item.id}" aria-label="Increase quantity">+</button>
              </div>
              <button class="cart-item__remove" type="button" data-remove="${item.id}" aria-label="Remove from cart">${trashIcon}</button>
            </div>
          </div>
        `;
      }).join('');

      countEl.textContent = count;
      const hasRealPrices = items.some(i => !isNaN(parseFloat(i.price)));
      subEl.textContent = hasRealPrices ? `$${subtotal.toFixed(2)}` : 'Set after pricing';
      totalEl.textContent = hasRealPrices ? `$${subtotal.toFixed(2)}` : 'Set after pricing';
    }

    function updateQty(id, delta) {
      const items = JSON.parse(localStorage.getItem('sera_cart_v1') || '[]');
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      const next = item.qty <= 0 ? items.filter(i => i.id !== id) : items;
      localStorage.setItem('sera_cart_v1', JSON.stringify(next));
      render();
      // Trigger sync for nav badge
      window.dispatchEvent(new StorageEvent('storage', { key: 'sera_cart_v1' }));
    }

    document.querySelector('[data-cart-page-items]').addEventListener('click', e => {
      const inc = e.target.closest('[data-qty-inc]');
      const dec = e.target.closest('[data-qty-dec]');
      const rem = e.target.closest('[data-remove]');
      if (inc) updateQty(inc.dataset.qtyInc, 1);
      else if (dec) updateQty(dec.dataset.qtyDec, -1);
      else if (rem) {
        const items = JSON.parse(localStorage.getItem('sera_cart_v1') || '[]');
        localStorage.setItem('sera_cart_v1', JSON.stringify(items.filter(i => i.id !== rem.dataset.remove)));
        render();
        window.dispatchEvent(new StorageEvent('storage', { key: 'sera_cart_v1' }));
      }
    });

    render();
    window.addEventListener('storage', e => {
      if (e.key === 'sera_cart_v1') render();
    });
  });
</script>
</body>
</html>
