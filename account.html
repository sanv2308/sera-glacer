<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · Sera Labs</title>
<meta name="description" content="Member sign-in for Sera Labs research catalog." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@200;300;400;500;600&family=Manrope:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared/site.css?v=20260519nav4" />
</head>
<body class="page-body" data-page="account">

<header id="site-nav"></header>

<main class="page">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="index.html">Home</a>
    <span aria-hidden="true">/</span>
    <span aria-current="page">Sign in</span>
  </nav>

  <h1 class="page-title">Sign in.</h1>
  <p class="page-intro">
    Members-only checkout, free to join. Sign in to view your batch history, COAs, and saved protocols.
  </p>

  <section class="page-section">
    <form class="form-stack" onsubmit="event.preventDefault(); alert('Authentication is not yet wired. Stand by.');">
      <label>
        Email
        <input type="email" name="email" placeholder="you@research.org" required />
      </label>
      <label>
        Password
        <input type="password" name="password" placeholder="••••••••" required />
      </label>
      <button type="submit">Sign in</button>
    </form>

    <p style="margin-top: 28px; font-family: var(--display); font-size: 14px; color: var(--ink-soft);">
      New to Sera? <a href="#" style="color: var(--accent-deep); text-decoration: none; border-bottom: 1px solid currentColor;">Create an account</a>
    </p>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="shared/site.js?v=20260519nav4" defer></script>
</body>
</html>
