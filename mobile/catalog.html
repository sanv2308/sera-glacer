<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>sera club | mobile catalog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Onest:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./mobile.css?v=20260519nav1" />
  </head>
  <body class="mobile-catalog" data-current="1">
    <main class="catalog-shell" aria-label="sera club mobile catalog">
      <section class="catalog-slide is-active" data-slide="1" aria-label="BPC-157">
        <img src="../assets/mobile/catalog-01-bpc.png" alt="BPC-157 mobile product page" />
      </section>
      <section class="catalog-slide" data-slide="2" aria-label="GHK-CU">
        <img src="../assets/mobile/catalog-02-ghk.png" alt="GHK-CU mobile product page" />
      </section>
      <section class="catalog-slide" data-slide="3" aria-label="TB-500">
        <img src="../assets/mobile/catalog-03-tb.png" alt="TB-500 mobile product page" />
      </section>
      <section class="catalog-slide" data-slide="4" aria-label="All compounds">
        <img src="../assets/mobile/catalog-04-index.png" alt="All compounds mobile index page" />
      </section>

      <button class="hotspot hotspot-menu" type="button" aria-label="Open menu"></button>
      <a class="floating-cart" href="#cart" aria-label="Shopping cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 8h14l-1.4 10.7a2 2 0 0 1-2 1.75H8.4a2 2 0 0 1-2-1.75L5 8Z"/>
          <path d="M9 8V6a3 3 0 1 1 6 0v2"/>
        </svg>
      </a>
      <button class="hotspot hotspot-prev top" type="button" data-dir="-1" aria-label="Previous compound"></button>
      <button class="hotspot hotspot-next top" type="button" data-dir="1" aria-label="Next compound"></button>
      <button class="hotspot hotspot-prev bottom" type="button" data-dir="-1" aria-label="Previous compound"></button>
      <button class="hotspot hotspot-next bottom" type="button" data-dir="1" aria-label="Next compound"></button>
      <a class="hotspot hotspot-purchase" href="#" aria-label="Purchase selected compound"></a>

      <nav class="mobile-dots" aria-label="Catalog pages">
        <button type="button" class="is-active" data-jump="1" aria-label="Go to BPC-157"></button>
        <button type="button" data-jump="2" aria-label="Go to GHK-CU"></button>
        <button type="button" data-jump="3" aria-label="Go to TB-500"></button>
        <button type="button" data-jump="4" aria-label="Go to all compounds"></button>
      </nav>
    </main>
    <script src="./mobile.js?v=20260516a"></script>
  </body>
</html>
